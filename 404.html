<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-hover: #2563eb;
            --accent-border: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-border);
            border-radius: 6px;
            padding: 32px 24px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-family: 'Merriweather', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1;
        }

        p {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            color: var(--primary-hover);
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .box {
                padding: 24px 16px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>404</h1>
        <p>Oops! Trang bạn tìm kiếm không tồn tại hoặc đã bị di chuyển.</p>
        <a href="/">← Quay về trang chủ</a>
    </div>

</body>
</html>
